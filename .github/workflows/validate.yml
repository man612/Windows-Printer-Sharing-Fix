name: Validate Windows Printer Fix

on:
  push:
    branches:
      - main
      - v4-tui-diagnosis-first
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: PowerShell 5.1 syntax and safety guards
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run validation with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Validate.ps1
