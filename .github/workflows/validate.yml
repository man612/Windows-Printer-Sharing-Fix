name: Validate Windows Printer Fix

on:
  push:
    branches:
      - main
      - v4-tui-diagnosis-first
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: PowerShell 5.1 validation and runtime smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate syntax and safety guards
        shell: powershell
        run: .\tests\Validate.ps1

      - name: Execute diagnosis-only runtime smoke test
        shell: powershell
        run: .\tests\RuntimeSmoke.ps1

      - name: Validate Indonesian localization output
        shell: powershell
        run: .\tests\LocalizationSmoke.ps1
