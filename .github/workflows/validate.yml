name: Validate Windows Printer Fix

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: PowerShell 5.1 validation and runtime smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate syntax and safety guards
        shell: powershell
        run: .\tests\Validate.ps1

      - name: Execute diagnosis-only runtime smoke test
        shell: powershell
        run: .\tests\RuntimeSmoke.ps1

      - name: Validate stable TUI performance guards
        shell: powershell
        run: .\tests\PerformanceSmoke.ps1

      - name: Validate sanitized lab evidence collector
        shell: powershell
        run: .\tests\EvidenceSmoke.ps1

      - name: Validate structured diagnosis JSON export
        shell: powershell
        run: .\tests\JsonExportSmoke.ps1

      - name: Validate PrintService event classification
        shell: powershell
        run: .\tests\PrintEventClassificationSmoke.ps1

      - name: Validate sanitized diagnosis examples
        shell: powershell
        run: .\tests\ExamplesSmoke.ps1

      - name: Validate Indonesian localization output
        shell: powershell
        run: .\tests\LocalizationSmoke.ps1

      - name: Validate runtime workspace migration
        shell: powershell
        run: .\tests\WorkspaceSmoke.ps1

      - name: Validate release package
        shell: powershell
        run: .\tests\PackageSmoke.ps1
