name: Validate Windows Printer Fix

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: PowerShell 5.1 validation and runtime smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate syntax and safety guards
        shell: powershell
        run: .\tests\Validate.ps1

      - name: Execute diagnosis-only runtime smoke test
        shell: powershell
        run: .\tests\RuntimeSmoke.ps1

      - name: Validate stable TUI performance guards
        shell: powershell
        run: .\tests\PerformanceSmoke.ps1

      - name: Validate sanitized lab evidence collector
        shell: powershell
        run: .\tests\EvidenceSmoke.ps1

      - name: Validate exact Windows build revision reporting
        shell: powershell
        run: .\tests\ExactBuildSmoke.ps1

      - name: Validate structured diagnosis JSON export
        shell: powershell
        run: .\tests\JsonExportSmoke.ps1

      - name: Validate headless diagnosis CLI
        shell: powershell
        run: .\tests\HeadlessSmoke.ps1

      - name: Validate formal diagnosis JSON Schema
        shell: powershell
        run: .\tests\JsonSchemaSmoke.ps1 -RequireValidator

      - name: Validate PrintService event classification
        shell: powershell
        run: .\tests\PrintEventClassificationSmoke.ps1

      - name: Validate printer policy source evidence
        shell: powershell
        run: .\tests\PolicySourceSmoke.ps1

      - name: Validate modern SMB/RPC diagnostics
        shell: powershell
        run: .\tests\ModernSmbRpcSmoke.ps1

      - name: Validate next-layer correlation
        shell: powershell
        run: .\tests\CorrelationSmoke.ps1

      - name: Validate printer driver classification
        shell: powershell
        run: .\tests\DriverClassificationSmoke.ps1

      - name: Validate Windows Protected Print readiness evidence
        shell: powershell
        run: .\tests\WppReadinessSmoke.ps1

      - name: Validate guided test-page verification
        shell: powershell
        run: .\tests\TestPageVerificationSmoke.ps1

      - name: Validate sanitized diagnosis examples
        shell: powershell
        run: .\tests\ExamplesSmoke.ps1

      - name: Validate Indonesian localization output
        shell: powershell
        run: .\tests\LocalizationSmoke.ps1

      - name: Validate runtime workspace migration
        shell: powershell
        run: .\tests\WorkspaceSmoke.ps1

      - name: Validate reproducible release package
        shell: powershell
        run: .\tests\ReproduciblePackageSmoke.ps1

      - name: Validate release workflow hardening
        shell: powershell
        run: .\tests\ReleaseWorkflowSmoke.ps1

      - name: Validate release package
        shell: powershell
        run: .\tests\PackageSmoke.ps1
