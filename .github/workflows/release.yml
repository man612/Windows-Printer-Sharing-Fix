name: Package stable release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    if: github.event.release.prerelease == false
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build user package and checksum
        shell: powershell
        run: .\tools\Build-Release.ps1 -Version "${{ github.event.release.tag_name }}" -OutputDirectory .\dist

      - name: Upload release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" .\dist\*.zip .\dist\SHA256SUMS.txt --clobber
